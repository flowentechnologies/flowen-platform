networks:
  flowen-mesh:
    driver: bridge
services:
  redis-cache:
    image: redis:7.2-alpine
    container_name: flowen-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - flowen-mesh
    command: ["redis-server", "--appendonly", "yes", "--port", "6379"]
  redpanda-broker:
    image: ://redpanda.com
    container_name: redpanda-1
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda-broker:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - flowen-mesh
    volumes:
      - redpanda_data:/var/lib/redpanda/data
  compliance-vault:
    image: hashicorp/vault:1.15.2
    container_name: flowen-vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=flowen-master-dev-token-2026
      - VAULT_LOCAL_CONFIG={"backend":{"file":{"path":"/vault/file"}},"default_lease_ttl":"168h","max_lease_ttl":"720h"}
    volumes:
      - vault_data:/vault/file
    networks:
      - flowen-mesh
volumes:
  redis_data:
  redpanda_data:
  vault_data:
